<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101114" />
  <meta name="description" content="A private live trading journal." />
  <title>Trading Journal</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <form class="auth-card" id="loginForm">
      <div class="brand-mark">T</div>
      <p class="eyebrow">Private workspace</p>
      <h1>Trading Journal</h1>
      <p class="muted">Sign in to your private journal.</p>
      <label>Email<input id="emailField" type="email" autocomplete="username" required /></label>
      <label>Password<input id="passwordField" type="password" autocomplete="current-password" required /></label>
      <p class="error" id="authError"></p>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>

  <main class="app" id="appShell" hidden>
    <header class="topbar">
      <div>
        <div class="brand-line"><div class="brand-mark small">T</div><strong>Trading Journal</strong></div>
        <div class="sync-line" id="syncStatus"><span class="dot"></span> Connecting…</div>
      </div>
      <div class="top-actions">
        <button class="ghost" id="refreshButton" type="button">Refresh</button>
        <button class="ghost" id="logoutButton" type="button">Sign out</button>
      </div>
    </header>

    <section class="page">
      <section class="quick-entry">
        <div class="quick-heading">
          <div>
            <p class="eyebrow">Write it now</p>
            <h1>What did you just buy?</h1>
          </div>
          <span class="shortcut">⌘/Ctrl + Enter saves</span>
        </div>

        <form id="quickTradeForm">
          <div class="quick-row">
            <input id="quickSymbol" class="symbol-input" type="text" autocomplete="off" placeholder="TOKEN" required />
            <select id="quickChain">
              <option value="robinhood">Robinhood</option>
              <option value="sol">Solana</option>
              <option value="arc">ARC</option>
              <option value="bsc">BSC</option>
            </select>
          </div>
          <textarea id="quickThesis" rows="3" placeholder="Why are you buying this right now?" required></textarea>
          <details class="details">
            <summary>Optional trade details</summary>
            <div class="details-grid">
              <input id="quickContract" type="text" autocomplete="off" placeholder="Contract / mint (optional)" />
              <input id="quickContext" type="text" autocomplete="off" placeholder="Entry / mcap note (optional)" />
            </div>
          </details>
          <div class="quick-footer">
            <span id="quickMessage" class="muted"></span>
            <button class="primary" type="submit">Save buy thesis</button>
          </div>
        </form>
      </section>

      <div class="feed-toolbar">
        <div>
          <p class="eyebrow">Live trade log</p>
          <h2>Newest first</h2>
        </div>
        <div class="filters" role="group" aria-label="Trade filters">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="open" type="button">Open</button>
          <button class="filter" data-filter="closed" type="button">Closed</button>
        </div>
      </div>

      <section id="tradeFeed" class="trade-feed" aria-live="polite"></section>
      <div id="feedEmpty" class="empty" hidden>No trades yet.</div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
